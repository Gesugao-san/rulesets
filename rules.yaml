  # Example of every entry kind. `enabled: false`: validated on every build, never published.
  # Copy entries from here into a real list; the values are illustrative.
  example:
    enabled: false
    action: block
    title: Example — ignored by the build
    entries:
      - domain: example.com
        evidence: [https://www.iana.org/help/example-domains]
      - domain: www.example.com
        sld_exception: deeper than SLD on purpose, explain why here
        evidence: [https://www.iana.org/help/example-domains]
      - ip: 192.0.32.0/20
        note: IPv4 or IPv6, no host bits set
        evidence: [https://example.com/why]
      - peerid: -XX0001-
        note: up to 8 characters; a trailing * is optional
        evidence: [https://example.com/why]
      - asn: 16876
        max_prefixes: 8
        evidence: [https://example.com/why]
      - country: AQ
        note: registration country, not geolocation
        evidence: [https://example.com/why]
      - continent: AN
        max_prefixes: 50
        evidence: [https://example.com/why]

profiles:
  throne:
    selective:
      name: Gesu selective
      default_outbound: direct
      # Order matters: rules are applied top to bottom.
      # Precise lists first, broad ones last: an explicit choice always beats a big external set.
      lists: [p2p-spies, ads, ru-direct, telegram, discord, youtube, services, ru-extra, ru-blocked, ru-broad]

