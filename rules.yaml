# Single source of truth for rulesets.
#
# This is the ONLY place where lists are edited. Everything else (podkop, sing-box,
# Throne, Tixati, qBittorrent, qBittorrent Enhanced) is built by CI into the `release` branch.
#
# Entry kinds:
#   domain: example.com   — the domain and all its subdomains (domain_suffix);
#                           must be a registrable domain (eTLD+1 by the Public Suffix List),
#                           otherwise `sld_exception: <reason>` is required
#   ip: 198.51.100.0/24   — IPv4/IPv6 address or subnet (no host bits set)
#   peerid: -XX0001-      — Peer ID prefix (up to 8 chars), only in lists with action: block
#   asn: 64500            — all prefixes the AS announces (RIPEstat announced-prefixes)
#   country: XX           — all prefixes REGISTERED to the country (RIPEstat country-resource-list,
#                           based on RIR delegation stats — registration, not geolocation)
#   continent: EU         — all countries of a GeoNames continent: AF AN AS EU NA OC SA
#   ruleset: geosite-xxx  — an external sing-box rule-set: a name from Throne's catalog
#                           (geosite-*, geoip-*) or an https link to a .srs file
#
# asn/country/continent are expanded at build time; the result lands in release/resolved/.
# Each has a `max_prefixes` guard (defaults: asn 16, country 20000, continent 200000):
# the build fails if an entry expands to more, so a broad entry is always a deliberate choice.
#
# Every entry in a list with action: block must have `evidence` — links that justify it.
# The `note` field is a free-form comment and never reaches the output files.
# A list with `enabled: false` is validated but builds nothing (see `example` at the end).

meta:
  repo: Gesugao-san/rulesets
  branch: release

lists:
  p2p-spies:
    action: block
    title: P2P spy bots (fake 100% bitfield, no real data)
    entries:
      - asn: 216158
        note: >-
          Teleport Rus LLC; announces only 31.200.249.0/24 (2026-11-18), the whole AS is the bot network;
          the RIPE contact matches the Teleport Media CEO
        max_prefixes: 4
        evidence:
          - https://forum.tixati.com/support/8669
          - https://forum.tixati.com/support/8351
          - https://forum.tixati.com/support/8857
      - ip: 185.16.215.0/24
        note: >-
          Start2 / NETRACK (AS61400), same ORG-SL744-RIPE that sponsors AS216158;
          blocked as a subnet, NOT by ASN: AS61400 is a hosting provider with ~90 prefixes
        evidence:
          - https://forum.tixati.com/support/8669
          - https://forum.tixati.com/support/8857
      - peerid: -BM0001-
        note: 'client "BM 0.0.0.1", metadata request overflow'
        evidence:
          - https://forum.tixati.com/support/8351
      - peerid: -MC0008-
        note: 'client "MC 0.0.0.8", drops the connection right after receiving the bitfield'
        evidence:
          - https://forum.tixati.com/support/7146
          - https://forum.tixati.com/support/8351

  ru-extra:
    action: proxy
