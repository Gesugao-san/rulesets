# Build and publish: rules.yaml → release branch.
# Any change to rules.yaml in main rebuilds every format; never edit the release branch by hand.
name: build

on:
  push:
    branches: [main]
    paths:
      - rules.yaml
      - tools/**
      - clients/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - rules.yaml
      - tools/**
      - clients/**
      - .github/workflows/build.yml
  workflow_dispatch:
  # Daily rebuild: asn/country/continent prefixes change without edits to rules.yaml.
  # No change → no commit and no tag.
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  # sing-box version and hash are pinned: bump deliberately, together with a .srs check.
  SING_BOX_VERSION: 1.14.4
  SING_BOX_SHA256: 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pip install pyyaml

      - name: sing-box (for .srs)
        run: |
          name="sing-box-${SING_BOX_VERSION}-linux-amd64"
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${name}.tar.gz"
          echo "${SING_BOX_SHA256}  sb.tgz" | sha256sum -c -
          tar xzf sb.tgz
          install -m 755 "${name}/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Tests (before the build, so nothing broken gets published)
        env:
          SING_BOX: /usr/local/bin/sing-box
        run: python -m unittest tools/test_build.py -v

      - name: Previous release (fallback if RIPEstat is down)
        run: |
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch --depth 1 origin release
            git worktree add --detach prev origin/release
          else
            mkdir prev
          fi

      - name: Build
        run: python tools/build.py --rules rules.yaml --out dist --sing-box /usr/local/bin/sing-box --snapshot prev

      - name: Publish to release
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The release branch is separate; if it does not exist yet, create an empty (orphan) one.
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git worktree add --detach rel origin/release
            git -C rel checkout -B release
          else
            git worktree add --detach rel
            git -C rel checkout --orphan release
            git -C rel rm -rf --quiet . || true
          fi

          # Full content replacement: lists removed from rules.yaml disappear from release too.
          find rel -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. rel/

          cd rel
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "build: ${GITHUB_SHA::7}"

          # Immutable tag per build for pinning and rollback; run number keeps it unique within a day.
          tag="build-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          git tag -a "${tag}" -m "Build of ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          # Atomic: either both the branch and the tag land, or neither does.
          git push --atomic origin release "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        id: publish

      - name: GitHub Release with files
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
          # Older releases are deleted, their tags stay (pinning by tag keeps working).
          KEEP_RELEASES: 30
        run: |
          # Release assets are a flat list: podkop/all-block.subnets.lst → podkop.all-block.subnets.lst.
          mkdir assets
          (cd dist && find . -type f | sed 's|^\./||') | while read -r f; do
            cp "dist/${f}" "assets/${f//\//.}"
          done
          gh release create "${TAG}" assets/* --title "${TAG}" --notes-file dist/README.md --latest

          gh release list --limit 1000 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r old; do gh release delete "${old}" --yes; done
